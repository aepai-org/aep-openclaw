name: Publish to npm
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [package.json]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@aepai/openclaw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME!==`v${p.version}`) process.exit(1)"
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  verify-install:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Read package version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Wait for npm propagation
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          for attempt in {1..20}; do
            if npm view "@aepai/openclaw@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then exit 1; fi
            sleep 15
          done
      - name: Install and import the public distribution
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/aep-openclaw-smoke"
          cd "$RUNNER_TEMP/aep-openclaw-smoke"
          npm init --yes
          npm install "openclaw@2026.7.2-beta.6" "@aepai/openclaw@${PACKAGE_VERSION}" --registry https://registry.npmjs.org
          node --input-type=module -e 'const plugin=(await import("@aepai/openclaw")).default; if(plugin.id!=="aep") process.exit(1); console.log(plugin.id)'
